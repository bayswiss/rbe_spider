name: Build and deploy docs

# Every version is deployed through GitHub Pages' Actions source (Settings > Pages > Source: GitHub Actions).
# Built HTML of each release is kept as an asset of the "docs-archive"
# release, so tagged versions are built once and the repo never grows.

on:
  push:
    branches: [main]        # rebuilds the "main" docs on every push
  workflow_dispatch:        # manual trigger (e.g. after editing docs-versions.yml)

# Read-only by default; only the deploy job gets write access
permissions:
  contents: read

# Allow one concurrent deployment, without cancelling one that is in progress
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ARCHIVE: docs-archive     # release (and tag) holding the built HTML
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  # ── Step 1: read the version config and decide what to build ──────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: List archived builds
        run: |
          gh release view "$ARCHIVE" --json assets --jq '.assets[].name' > archived.txt \
            || touch archived.txt   # release doesn't exist before the first run
          cat archived.txt

      - name: Build job matrix
        id: set-matrix
        run: python3 .github/scripts/docs_site.py matrix archived.txt

  # ── Step 2: build each version that needs it ──────────────────────────────
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: ${{ matrix.dolfinx_image }}
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
      fail-fast: false    # a broken main build shouldn't block a tagged build
    
    steps:
      - name: Checkout rbe_spider at ${{ matrix.git_ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.git_ref }}

      - name: Install documentation dependencies
        run: python3 -m pip install -r requirements-docs.txt

      - name: Build docs
        # No -W here: older tags are built with their own configuration, and a warning in one of them (or a slow
        # intersphinx server) should not drop that version from the site. The pull request check uses -W.
        run: jupyter-book build .

      # A tarball keeps hidden files and permissions, and is what gets archived
      - name: Package HTML
        run: tar -czf "docs-${{ matrix.git_ref }}.tar.gz" -C _build/html .

      - name: Upload built HTML as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-${{ matrix.label }}
          path: docs-${{ matrix.git_ref }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ── Step 3: archive new builds, assemble all versions and deploy ──────────
  deploy:
    needs: [plan, build]
    permissions:
      contents: write       # to upload to the docs-archive release
      pages: write          # to deploy to GitHub Pages
      id-token: write       # to verify the deployment originates from here
    # Publish whatever built, even if one version failed
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rbe_spider (version list and flyout)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Download freshly built versions
        uses: actions/download-artifact@v8
        with:
          pattern: docs-*
          path: fresh/
          merge-multiple: true

      # main is archived too, so a failed build falls back to the last good one
      - name: Archive new builds
        run: |
          gh release view "$ARCHIVE" > /dev/null 2>&1 \
            || gh release create "$ARCHIVE" --prerelease --latest=false \
                 --title "Documentation archive" \
                 --notes "Built HTML of each documented version, used by the docs deployment. Do not delete."
          shopt -s nullglob
          for f in fresh/docs-*.tar.gz; do
            gh release upload "$ARCHIVE" "$f" --clobber
          done

      - name: Assemble site
        run: python3 .github/scripts/docs_site.py assemble fresh site

      # Read the Docs-style injection: one root script serves every version
      - name: Inject version flyout
        run: |
          cp .github/docs-version-flyout.js site/version-flyout.js
          python3 .github/scripts/docs_site.py inject site

      # Drop archived builds of tags no longer listed in docs-versions.yml
      - name: Prune archive
        run: |
          keep=$(python3 .github/scripts/docs_site.py assets)
          for asset in $(gh release view "$ARCHIVE" --json assets --jq '.assets[].name'); do
            case " ${keep} " in
              *" ${asset} "*) ;;
              *) echo "Removing ${asset}"; gh release delete-asset "$ARCHIVE" "$asset" --yes ;;
            esac
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
